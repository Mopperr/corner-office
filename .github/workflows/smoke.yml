name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -o /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT=/tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import class cache, then smoke
        run: bash tests/run_smoke.sh
      - name: Play the slice end to end
        run: bash tests/run_playthrough.sh
